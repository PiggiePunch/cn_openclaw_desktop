name: Bug 反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈。请尽量提供可复现信息，以便快速定位问题。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么？预期应该是什么？
      placeholder: 简要描述问题与预期行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按 1/2/3 列出操作步骤
      placeholder: |
        1. 进入页面 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 可粘贴关键报错、终端日志、截图
      render: shell
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 v1.0.0
  - type: input
    id: os
    attributes:
      label: 系统环境
      placeholder: 例如 macOS 14 / Windows 11 / Ubuntu 24.04
  - type: checkboxes
    id: terms
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复问题
          required: true
        - label: 我已移除日志中的敏感信息（Token、密钥等）
          required: true

