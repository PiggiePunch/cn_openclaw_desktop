name: 功能建议
description: 提交新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景问题
      description: 你遇到了什么痛点？
      placeholder: 说明当前方案的问题或限制
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何改进？
      placeholder: 描述期望行为、交互或 API
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其他实现？
      placeholder: 可选
  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 对哪些模块有影响？
      placeholder: 例如 聊天页 / 定时任务 / 通道管理
  - type: checkboxes
    id: terms
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复建议
          required: true

