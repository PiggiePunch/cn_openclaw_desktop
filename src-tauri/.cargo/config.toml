# ========== Cargo 编译优化配置 ==========

# 使用所有 CPU 核心
[build]
jobs = 8

# 在当前 macOS + rustc 组合下，增量缓存可能导致链接阶段未定义符号
# 关闭增量编译，优先保证 tauri:dev 稳定
incremental = false

# ========== 链接器优化 (macOS) ==========
[target.aarch64-apple-darwin]
# 使用更快的链接器 (如果安装了 lld)
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# 注意：
# 在 macOS 26 + rustc 1.92 环境下，`target-cpu=native` 会触发链接阶段
# 未定义符号（std::sys::thread_local::native::eager::destroy）问题。
# 这里改为使用默认 target-cpu，保证 `tauri dev` 稳定可运行。
# 如需极致性能，建议仅在 release 单独通过环境变量开启。
# rustflags = [
#   "-C", "target-cpu=native",
# ]

# ========== 通用优化 ==========
[target.x86_64-apple-darwin]
# 同上，默认不强制 target-cpu=native。
# rustflags = [
#   "-C", "target-cpu=native",
# ]

# ========== 网络优化 ==========
[net]
# 并行下载依赖
retry = 3
offline = false

[http]
# HTTP 超时
timeout = 60
low-speed-limit = 10

# ========== 注册表优化 ==========
[registry]
# 使用稀疏注册表（更快）
protocol = "sparse"

# ========== term 优化 ==========
[term]
# 进度条
verbose = false
color = "auto"
