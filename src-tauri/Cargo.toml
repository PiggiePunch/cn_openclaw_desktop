[package]
name = "openclaw-desktop"
version = "1.0.0"
description = "OpenClaw 国内版 - AI 助手桌面应用"
authors = ["OpenClaw Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "openclaw_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ============================================
# Tauri 核心
# ============================================
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

# ============================================
# 序列化
# ============================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ============================================
# 异步运行时
# ============================================
tokio = { version = "1", features = [
    "rt-multi-thread",  # 多线程运行时
    "time",             # 时间相关
    "sync",             # 同步原语
    "net",              # 网络
    "fs",               # 文件系统
    "process",          # 进程
    "io-util",          # IO 工具
    "macros",           # 宏支持
] }

# ============================================
# 错误处理
# ============================================
anyhow = "1"
thiserror = "1"

# ============================================
# 系统工具
# ============================================
dirs = "5"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.30"

# ============================================
# HTTP 客户端（用于 OpenClaw Manager）
# ============================================
reqwest = { version = "0.12", features = ["json", "stream"] }
urlencoding = "2.1"

# ============================================
# 日志
# ============================================
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-appender = "0.2"

# ============================================
# 日期时间
# ============================================
chrono = { version = "0.4", features = ["serde"] }

# ============================================
# 工具库
# ============================================
once_cell = "1.19"
regex = "1"
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
async-trait = "0.1"
parking_lot = "0.12"
lazy_static = "1.4"
shell-words = "1.1"
which = "6.0"
url = "2"
hostname = "0.4"
tempfile = "3.13"

# ============================================
# macOS 权限系统依赖
# ============================================
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.9"

[dev-dependencies]
futures = "0.3"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# ============================================
# 编译优化配置
# ============================================

[profile.dev]
# 开发模式也启用一定优化
opt-level = 1
# 启用增量编译
incremental = true
# 减少调试信息（减少编译时间和体积）
debug = 1

[profile.dev.package."*"]
# 依赖库在开发模式下也使用优化
opt-level = 2

[profile.release]
# 最高优化级别
opt-level = 3
# 剥离符号表（减少体积）
strip = true
# 链接时优化（减少体积和提升性能）
lto = "thin"
# 减少编译时间（牺牲一点优化）
codegen-units = 16

# ============================================
# 开发时警告配置
# ============================================
# 开发时抑制警告，提升开发体验
# 生产构建时会启用严格检查
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"
unexpected_cfgs = "allow"  # 抑制 objc crate 宏的 cfg 条件警告
